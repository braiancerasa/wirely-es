[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wirely"
version = "1.5.4.2"
description = "App gratuita de diseño y simulación de circuitos (traducción al español de Wirely, de Richard Willmott)"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Richard Willmott" }]
maintainers = [{ name = "Braian Ezequiel Cerasa" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "numpy>=1.24"]

[project.scripts]
wirely = "wirely.__main__:main"

[tool.setuptools.packages.find]
include = ["wirely*"]

[tool.setuptools.package-data]
wirely = ["assets/*"]
